# This is an example configuration for Lube oil cooling system
#
# FMUs and system description can be found here:
# https://github.com/Novia-RDI-Seafaring/fmu-library/tree/main/models/loc
#_____________________________________________________________________________________________________________

################# FMUs and OPC UA Servers #################

fmu_files: 
  ["experiments/fmus/LOC_2024a_dev_03112025.fmu"]

external_servers: []

################# Scenario #################

experiment:
  experiment_name: Lube Oil Cooling
  timestep: 1     
  timing: "simulation_time"  
  stop_time: 600.0  
  initial_system_state:
    
    LOC_2024a_dev_03112025:
      timestep: 0.1
      setpoint_temperature_oil: 50
      temperature_cooling_liquid_in: 35 
      mass_flow_cooling_liquid_in: 20
      engine_load: 1 # 0-1 <-> 0-100%
      Kp: 1
      Ti: 10

  start_readings_conditions: 
    condition_01: "LOC_2024a_dev_03112025.temperature_oil > 0"

  system_loop: 

  ################# evaluation #################

    # System evaluation functions, enable: true/false
  evaluation: 
    Alarm_temp_oil:
      condition: "LOC_2024a_dev_03112025.temperature_oil < 58"
      enabled: true

  # These values are logged in separate log
  logging:
    ["LOC_2024a_dev_03112025.position_valve", "LOC_2024a_dev_03112025.temperature_cooling_liquid_out" , "LOC_2024a_dev_03112025.temperature_oil"]